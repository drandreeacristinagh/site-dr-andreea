      - name: contact_instagram
        label: "Contact – Instagram"
        type: string
      - name: topic_1_title
        label: "Topic 1 title"
        type: string
      - name: topic_1_description
        label: "Topic 1 description"
        type: text
      - name: topic_2_title
        label: "Topic 2 title"
        type: string
