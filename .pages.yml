        label: "Domenii – introducere"
        type: text
      - name: articles_eyebrow
        label: "Articole – supratitlu"
        type: string
      - name: articles_title
        label: "Articole – titlu"
        type: string
      - name: articles_description
        label: "Articole – descriere"
        type: string
      - name: articles_empty
        label: "Articole – mesaj temporar"
        type: string
      - name: resources_eyebrow
        label: "Resurse – supratitlu"
        type: string
      - name: resources_title
        label: "Resurse – titlu"
        type: string
      - name: resources_empty
        label: "Resurse – mesaj temporar"
        type: string
      - name: contact_eyebrow
        label: "Contact – supratitlu"
        type: string
