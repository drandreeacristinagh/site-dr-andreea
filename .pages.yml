media:
  input: assets
  output: /assets
content:
  - name: site
    label: Textele și fotografiile site-ului
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand_name
        label: "Antet – nume"
        type: string
      - name: brand_subtitle
        label: "Antet – subtitlu"
        type: string
      - name: hero_eyebrow
        label: "Prima pagină – supratitlu"
        type: string
      - name: hero_title
        label: "Prima pagină – titlu"
        type: string
      - name: hero_description
        label: "Prima pagină – descriere"
        type: text
      - name: hero_note
        label: "Prima pagină – nota"
        type: string
      - name: intro
        label: "Banda de introducere"
        type: text
      - name: about_eyebrow
        label: "Despre mine – supratitlu"
        type: string
      - name: about_title
        label: "Despre mine – titlu"
        type: string
      - name: about_intro
        label: "Despre mine – prezentare"
        type: text
      - name: about_description
        label: "Despre mine – continuare"
        type: text
      - name: about_signature
        label: "Despre mine – semnătură"
